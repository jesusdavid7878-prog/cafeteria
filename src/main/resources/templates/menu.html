<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${titulo}">Menú</title>
  <link rel="stylesheet" href="/css/cafeteria.css">
</head>
<body>
  <h1 th:text="${titulo}">Título</h1>

  <div class="barra">
    <div class="grupo-botones">
      <a th:href="@{/contacto}" class="boton">Contacto</a>
      <button type="button" class="boton secundario" id="abrir-acerca">Acerca de</button>
    </div>
  </div>

  <dialog class="ventana-acerca" id="ventana-acerca" aria-labelledby="titulo-acerca">
    <h2 id="titulo-acerca">Acerca de</h2>
    <dl>
      <dt>Nombre</dt>
      <dd>Jesus David Alcala Hernandez</dd>
      <dt>Fecha</dt>
      <dd><time id="fecha-hoy"></time></dd>
      <dt>Número de ficha</dt>
      <dd>3230489</dd>
    </dl>
    <button type="button" class="boton" id="cerrar-acerca">Cerrar</button>
  </dialog>

  <p class="mensaje-exito" th:if="${mensajeContacto}" th:text="${mensajeContacto}"></p>

  <!-- Enlaces de filtro: @{/menu(tipo='bebida')} construye /menu?tipo=bebida -->
  <p>
    <a th:href="@{/menu}">Todos</a> ·
    <a th:href="@{/menu(tipo='desayuno')}">Desayunos</a> ·
    <a th:href="@{/menu(tipo='almuerzo')}">Almuerzos</a> ·
    <a th:href="@{/menu(tipo='bebida')}">Bebidas</a>
  </p>

  <ul>
    <li th:each="p : ${platos}">
      <a th:href="@{/menu/{id}(id=${p.id})}" th:text="${p.nombre}">Plato</a>
      · $ <span th:text="${#numbers.formatInteger(p.precio, 1, 'POINT')}">0</span>
    </li>
  </ul>
  <p th:if="${#lists.isEmpty(platos)}">No hay platos de ese tipo.</p>
  <script>
    const ventanaAcerca = document.getElementById("ventana-acerca");

    document.getElementById("abrir-acerca").addEventListener("click", () => {
      ventanaAcerca.showModal();
    });

    document.getElementById("cerrar-acerca").addEventListener("click", () => {
      ventanaAcerca.close();
    });

    document.getElementById("fecha-hoy").textContent =
      new Intl.DateTimeFormat("es-CO", { dateStyle: "long" }).format(new Date());
  </script>
</body>
</html>
